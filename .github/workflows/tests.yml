name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and gates everything below it. Both checks are seconds, the
  # suite is not, and a NameError-class defect is exactly what ruff catches
  # for free -- `main` shipped five of them for eighteen days because nothing
  # ran (see the restore-dropped-code PR).
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # `.` is the tracked tree here: a fresh checkout has no untracked
      # scratch directories, so this matches what the pre-commit hook lints.
      - name: ruff check
        run: uv run ruff check .

      # Scoped to the package. `mypy tests/` reports 16 pre-existing errors
      # in 12 files; widening the scope is its own chore, not this PR's.
      - name: mypy
        run: uv run mypy lms/

  # Runs in parallel with `pytest`, not inside it. The Lean-dependent modules
  # are the only ones that skip without a toolchain (16 tests, all in these two
  # files), and paying a toolchain install inside the fast job would slow the
  # feedback everyone waits on. Split this way the workflow's wall clock is
  # unchanged -- this job just costs extra runner minutes.
  #
  # Deliberately NO Mathlib and NO `lake build`: every one of these tests
  # constructs `RealLeanVerifier()` with no project, which runs bare `lean` on
  # core-only code (`Nat`, `True`, `trivial`, `rfl`). Pulling the Mathlib cache
  # would multiply the cost for nothing. lean.yml still builds the corpus.
  lean-tests:
    name: pytest (real Lean verifier)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # elan only, pinned to the same toolchain the corpus builds against.
      # --no-modify-path because GITHUB_PATH below is what persists across steps.
      #
      # Deliberately not cached. Measured on the first run: acquiring the
      # toolchain costs ~10s (elan-init, then a lazy download on first use),
      # while saving the 632 MiB cache cost 9.3s -- a wash. The repo's cache
      # already holds two 2.31 GiB library caches for lean.yml, and a marginal
      # entry that saves nothing risks evicting one that saves minutes.
      - name: Install the pinned Lean toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --no-modify-path \
                  --default-toolchain "$(cat lean/lean-toolchain)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      # Without this the job is worthless: if the toolchain were missing or
      # unconfigured, every test below would skip and the job would still be
      # green. That is the exact failure this whole card exists to remove.
      - name: Assert Lean is usable, so nothing below can skip silently
        run: |
          lean --version
          uv run python -c "
          from tests._lean_env import lean_available
          assert lean_available(), 'toolchain present but not usable'
          "

      - name: Run the modules that need a real verifier
        run: |
          uv run pytest \
            tests/test_lean_real.py tests/test_verify_namespace.py \
            -q -rs --no-header

  pytest:
    needs: lint
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `uv sync` installs dependency-groups.dev (pytest, pytest-asyncio),
      # which `asyncio_mode = "auto"` in pyproject.toml depends on. --frozen
      # pins to uv.lock rather than re-resolving, so a red run means the code
      # changed, not that a transitive dependency did.
      - name: Install dependencies
        run: uv sync --frozen

      # The runner has no Lean toolchain, so the `shutil.which("lean")` guards
      # in test_lean_real.py / test_verify_namespace.py skip those modules here.
      # The Lean corpus is built by lean.yml instead.
      - name: Run tests
        run: uv run pytest -q

      # The suite must not write into the tracked Lean corpus (conftest.py's
      # isolate_default_foundation fixture exists to prevent exactly this).
      # A dirty lean/ here means that guard regressed.
      - name: Assert the tracked Lean corpus was not modified
        run: |
          if [ -n "$(git status --porcelain lean/)" ]; then
            echo "::error::pytest modified the tracked Lean corpus:"
            git status --porcelain lean/
            exit 1
          fi
          echo "lean/ clean after the suite"
