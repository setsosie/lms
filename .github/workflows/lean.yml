name: Lean

# Scoped to changes that can actually break the corpus. A Lean build pulls the
# Mathlib cache and takes minutes; making every Python-only PR wait on it would
# just teach people to ignore the check.
on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
      - 'data/ant_arcs/**'
      - 'scripts/check_arc_elaboration.py'
      - 'lms/novelty/mathlib_search.py'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
      - 'data/ant_arcs/**'
      - 'scripts/check_arc_elaboration.py'
      - 'lms/novelty/mathlib_search.py'
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lake build (LMS corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # lean-action installs elan, reads lean/lean-toolchain, and fetches the
      # Mathlib cache before building. The lakefile's `globs = ["LMS.+"]` is
      # what makes this build every module under LMS/ rather than the single
      # root module.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      # The ANT arc drafts are what the N1-density measurement probes. A draft
      # that doesn't elaborate is never measured, and nothing else here would
      # notice: 12 of 41 failed at the pin until the 2026-11-07 box run showed it.
      # This uses the probe's own framing, so it needs the package installed.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Every ANT arc draft elaborates at the pin
        run: uv run python scripts/check_arc_elaboration.py
